<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<title>Proportions with Ponya and Bulya</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;600;800&family=Caveat:wght@600&display=swap">
<style>
/* Layout: meadow page, hero with the two guinea pigs, tab strip, one level per tab; level = work area + task card */
:root{
  --bg:#EEF3E4; --paper:#FFFFFF; --ink:#26301F; --muted:#5F6B55; --line:#D3DCC5; --shadow:rgba(38,48,31,.12);
  --yarn:#D9486F; --plum:#7A59C2; --hay:#D99A1E; --leaf:#4F8A3C; --sky:#3E7FB8; --marker:#FFE24A; --marker-ink:#2A2300;
  --good:#2F8A4C; --bad:#C2413B; --cell:#F4F7EE;
  --display:'Comfortaa','Nunito',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --hand:'Caveat','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171C14; --paper:#222A1D; --ink:#EDF2E3; --muted:#A8B49B; --line:#3A4532; --shadow:rgba(0,0,0,.35);
  --yarn:#F07898; --plum:#B79CFF; --hay:#F0BE4E; --leaf:#7DBA62; --sky:#7AB3E6; --marker:#E8C93A; --marker-ink:#1D1800;
  --good:#6CCB86; --bad:#F07A72; --cell:#2C3526; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171C14; --paper:#222A1D; --ink:#EDF2E3; --muted:#A8B49B; --line:#3A4532; --shadow:rgba(0,0,0,.35);
  --yarn:#F07898; --plum:#B79CFF; --hay:#F0BE4E; --leaf:#7DBA62; --sky:#7AB3E6; --marker:#E8C93A; --marker-ink:#1D1800;
  --good:#6CCB86; --bad:#F07A72; --cell:#2C3526; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,6vw,46px)}
h2{font-size:clamp(22px,4vw,30px)}
h3{font-size:19px}
p{margin:0}
a{color:var(--sky);font-weight:700}
.hand{font-family:var(--hand);font-size:24px;line-height:1.2}

.hero{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;padding-block:8px 18px}
.hero-text{flex:1 1 320px;min-width:0;display:grid;gap:8px}
.hero-text h1 span{color:var(--yarn)}
.hero-text p{color:var(--muted);max-width:56ch}
.pigs{display:flex;gap:6px;align-items:flex-end;flex:0 1 auto}
.pig-box{display:grid;justify-items:center}
.pig{width:120px;max-width:100%;height:auto}
.pig-name{font-family:var(--hand);font-size:24px;margin-top:-4px}
.stars{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:800;color:var(--muted)}
.star{font-size:26px;color:var(--line);transition:color .3s}
.star.on{color:var(--hay)}
.diploma{margin-top:6px;padding:14px 18px;border:2px dashed var(--hay);border-radius:14px;background:var(--paper)}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:8px 22px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.tab{font:700 15px var(--body);border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--yarn);background:var(--yarn);color:var(--paper)}
.tab:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

.panel{display:grid;gap:22px}
.lead{max-width:62ch}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 0 var(--shadow);min-width:0}

/* proportion typography */
.e{color:var(--yarn);font-weight:800}.m{color:var(--plum);font-weight:800}
.pr{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.big{font-family:var(--display);font-weight:700;font-size:clamp(24px,5vw,32px);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:.3em;align-items:center}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;vertical-align:middle;font-size:.8em}
.fr>span+span{border-top:2px solid currentColor;padding-top:2px;min-width:1em;text-align:center}
.mark{background:var(--marker);color:var(--marker-ink);border-radius:6px;padding:0 .3em}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.lesson{display:grid;gap:10px;align-content:start}
.lesson.key{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.lesson.key .e,.lesson.key .m{color:inherit}
.lesson.wide{grid-column:1/-1}
.num{font-weight:800;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.lesson.key .num{color:var(--marker-ink)}
.ex{font-variant-numeric:tabular-nums;background:var(--cell);border-radius:10px;padding:8px 12px;font-weight:600}
.lesson.key .ex{background:rgba(255,255,255,.45)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:700}
ol.swaps{margin:0;padding-left:1.3em;display:grid;gap:6px}
.note{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.note .pig{width:90px}

/* levels */
.level{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.level{grid-template-columns:1fr}}
.stage{display:grid;gap:12px;justify-items:center;text-align:center}
.scale{width:100%;max-width:420px;height:auto}
.task{display:grid;gap:12px}
.step{font-weight:800;color:var(--muted);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.lab{font-weight:700;font-size:15px}
input.ans{font:700 18px var(--body);width:110px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
input.ans.ie{border-color:var(--yarn)}input.ans.im{border-color:var(--plum)}
.btn{font:800 16px var(--body);border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--leaf);color:var(--paper)}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line)}
.btn.opt{background:var(--paper);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.fb{min-height:1.5em;font-weight:700}
.fb.good{color:var(--good)}
.fb.bad{color:var(--bad)}
.hint{color:var(--muted);font-size:15px;border-left:3px solid var(--hay);padding-left:10px}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9);opacity:.3}100%{transform:none;opacity:1}}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--leaf)}.dot.cur{outline:2px solid var(--leaf);outline-offset:2px}
.recipe{display:grid;gap:10px;justify-items:start;text-align:left;width:100%}
.recipe .big{justify-content:flex-start}

/* cards */
.cards{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap;font:700 24px var(--display)}
.pc{width:clamp(48px,14vw,68px);height:clamp(64px,18vw,86px);flex:none;border-radius:12px;background:var(--paper);border:3px solid var(--c);color:var(--c);font:700 26px var(--display);cursor:pointer;display:grid;place-items:center;box-shadow:0 3px 0 var(--shadow);font-variant-numeric:tabular-nums;padding:0}
.pc.sel{transform:translateY(-6px);background:var(--c);color:var(--paper)}
.pc:disabled{cursor:default}
.pc input{width:100%;font:700 24px var(--display);text-align:center;border:0;background:transparent;color:var(--c)}
.slots{display:flex;gap:10px;flex-wrap:wrap}
.slot{width:54px;height:64px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font:700 30px var(--display);color:var(--yarn);background:var(--paper)}
.slot.open{border-style:solid;border-color:var(--yarn)}
.reveal{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.reveal .pig{width:100px}.cat{width:120px;height:auto}

.rep{display:grid;gap:18px}
.rep ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.rep li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.rep li span:first-child{min-width:0}
.st{font-weight:800;font-size:15px}
.st.ok{color:var(--good)}.st.mid{color:var(--hay)}.st.no{color:var(--muted)}.st.bad{color:var(--bad)}
#reportText{width:100%;font:15px/1.5 var(--body);padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<style>.site-home{max-width:980px;margin:0 auto;padding-top:12px;font:700 15px var(--body,system-ui,sans-serif)}.site-home a{color:var(--sky,#3E7FB8);text-decoration:none}.site-home a:hover{text-decoration:underline}.site-copy{max-width:980px;margin:0 auto;padding-block:4px 28px;border-top:1px solid var(--line,#D3DCC5);padding-top:14px;font:14px/1.5 var(--body,system-ui,sans-serif);color:var(--muted,#5F6B55);text-align:center}.site-copy small{display:block;font-size:12px;opacity:.75;margin-top:2px}</style></head>
<body><nav class="site-home"><a href="../index-en.html">← All topics</a></nav>
<div class="wrap">
  <header class="hero">
    <div class="hero-text">
      <h1 data-t="h1"></h1>
      <p data-t="intro"></p>
      <p style="font-size:15px" data-t="langLink"></p>
      <div class="stars" aria-live="polite">
        <span data-t="yourStars"></span>
        <span class="star" id="st-p">★</span>
        <span class="star" id="st-k">★</span>
        <span class="star" id="st-c">★</span>
        <button class="btn ghost" id="resetAll" style="padding:4px 12px;font-size:14px"></button>
      </div>
      <div class="diploma" id="diploma" hidden><h3 data-t="dipH"></h3><p data-t="dipP"></p></div>
    </div>
    <div class="pigs" id="heroPigs"></div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="learn" id="t-learn" data-t="tabLearn"></button>
    <button class="tab" role="tab" data-tab="p" id="t-p" data-t="tabP"></button>
    <button class="tab" role="tab" data-tab="k" id="t-k" data-t="tabK"></button>
    <button class="tab" role="tab" data-tab="c" id="t-c" data-t="tabC"></button>
    <button class="tab" role="tab" data-tab="report" id="t-report" data-t="tabR"></button>
  </nav>

  <section class="panel" id="p-learn"></section>

  <section class="panel" id="p-p" hidden>
    <div class="lead"><h2 data-t="pH"></h2><p style="margin-top:8px" data-t="pIntro"></p></div>
    <div class="level">
      <div class="card stage"><div id="scaleProp" class="big"></div><div id="scale"></div></div>
      <div class="card task" id="pTask"></div>
    </div>
    <div><button class="btn ghost" id="pReset" data-t="pReset"></button></div>
  </section>

  <section class="panel" id="p-k" hidden>
    <div class="lead"><h2 data-t="kH"></h2><p style="margin-top:8px" data-t="kIntro"></p></div>
    <div class="card task" id="kTask"></div>
    <div><button class="btn ghost" id="kReset" data-t="kReset"></button></div>
  </section>

  <section class="panel" id="p-c" hidden>
    <div class="lead"><h2 data-t="cH"></h2><p style="margin-top:8px" data-t="cIntro"></p></div>
    <div class="slots" id="slots"></div>
    <div class="level">
      <div class="card stage" id="cStage"></div>
      <div class="card task" id="cTask"></div>
    </div>
    <div><button class="btn ghost" id="cReset" data-t="cReset"></button></div>
  </section>

  <section class="panel" id="p-report" hidden>
    <div class="lead"><h2 data-t="rH"></h2><p style="margin-top:8px" data-t="rIntro"></p></div>
    <div class="card" id="reportCard"></div>
    <div class="row"><button class="btn" id="copyReport" data-t="copy"></button><span class="fb" id="copyFb" aria-live="polite"></span></div>
    <textarea id="reportText" readonly hidden rows="14" aria-label="Report text"></textarea>
  </section>
</div>

<script>
const LANG='en';
const UK=LANG==='uk';
const KEY='ponya-bulya-proportions-'+LANG+'-v1';
const $=s=>document.querySelector(s);
const tr=o=>o[LANG];
const num=v=>{const x=parseFloat(String(v).replace(',','.').trim());return isNaN(x)?null:x};
const fmt=v=>typeof v==='number'?(UK?String(v).replace('.',','):String(v)):v;
const DIV=UK?':':'÷', MUL=UK?'·':'×';
const fr=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
// a : b = c : d with outer terms pink, inner terms violet
const prop=(p)=>`<span class="pr"><span class="e">${fmt(p[0])}</span> : <span class="m">${fmt(p[1])}</span> = <span class="m">${fmt(p[2])}</span> : <span class="e">${fmt(p[3])}</span></span>`;

const S={
uk:{
  h1:'Пропорції з <span>Понею</span> і <span>Булею</span>',
  intro:'Поня і Буля знову кличуть на допомогу! Спершу прочитай урок, потім пройди три рівні: зважуй пропорції на терезах, готуй салат на кухні і з’ясуй, хто вночі переставив картки.',
  langLink:'<a href="../proportions/uk.html">English version</a>',
  yourStars:'Твої зірки:', resetAll:'Почати все спочатку', resetSure:'Точно? Натисни ще раз',
  dipH:'Диплом знавця пропорцій',
  dipP:'Усі три рівні пройдено! Поня і Буля урочисто вітають тебе. Тепер ти знаходиш невідомий член пропорції швидше, ніж Буля знаходить моркву.',
  tabLearn:'Урок', tabP:'1. Терези', tabK:'2. Кухня', tabC:'3. Картки', tabR:'Мій звіт',
  pH:'Рівень 1. Чесні терези',
  pIntro:'У Булі є чарівні терези. На ліву чашу кладуть добуток <span class="e">крайніх</span> членів, на праву — добуток <span class="m">середніх</span>. Якщо терези в рівновазі, це справжня пропорція.',
  pReset:'Почати терези заново',
  kH:'Рівень 2. Кухня Поні',
  kIntro:'Поня готує частування і в’яже шарфик, а кількості треба перерахувати. У кожному завданні сховався невідомий член пропорції. Знайди його!',
  kReset:'Почати кухню заново',
  cH:'Рівень 3. Хто переставив картки?',
  cIntro:'Увечері Поня виклала з карток пропорцію <span class="pr">10 : 40 = 6 : 24</span>. Уранці картки лежали інакше! Виконуй завдання: кожне правильне відкриває одну літеру імені того, хто грався картками вночі.',
  cReset:'Почати розслідування заново',
  rH:'Мій звіт', rIntro:'Тут видно, що вже пройдено. Натисни «Надіслати звіт» і вибери Viber, Telegram чи пошту. Або скопіюй звіт і встав його в повідомлення вчителеві чи батькам.',
  copy:'Скопіювати звіт', copied:'Скопійовано! Встав звіт у повідомлення.', copyFail:'Автоматично скопіювати не вийшло. Текст звіту виділено нижче: скопіюй його вручну.',
  task:(i,n)=>`Завдання ${i} з ${n}`, check:'Перевірити', hint:'Підказка: ', typeNum:'Впиши число.',
  done:'Рівень пройдено',
  outer:'крайні', inner:'середні',
  // level 1
  pProdQ:'Порахуй добуток крайніх і добуток середніх, щоб покласти їх на терези.',
  pProdE:'Добуток крайніх', pProdM:'Добуток середніх',
  pProdBad:'Не зовсім. Перевір множення.',
  pProdHint:(p)=>`крайні — це <span class="e">${fmt(p[0])}</span> і <span class="e">${fmt(p[3])}</span>, середні — <span class="m">${fmt(p[1])}</span> і <span class="m">${fmt(p[2])}</span>. Перемнож кожну пару.`,
  pYesNoQ:'Це пропорція?', yes:'Так, пропорція', no:'Ні, не пропорція',
  pYesNoQ2:'Подивись на запис і виріши: це пропорція? Терези покажуть відповідь, коли ти відповіси.',
  pOkYes:(L,R)=>`Правильно! ${fmt(L)} = ${fmt(R)}, терези в рівновазі. Це пропорція.`,
  pOkNo:(L,R)=>`Правильно! ${fmt(L)} ≠ ${fmt(R)}, терези перехилились. Це не пропорція.`,
  pBadYN:'Ой, ні. Порахуй добутки і порівняй їх.',
  pYNHint:(p)=>`порахуй ${fmt(p[0])} ${MUL} ${fmt(p[3])} і ${fmt(p[1])} ${MUL} ${fmt(p[2])}. Якщо вийшло однаково, це пропорція.`,
  pDoneH:'Терези перевірено!', pDoneP:'Ти знаєш головний секрет пропорцій: добуток крайніх дорівнює добутку середніх. Перша зірка твоя.', toK:'На кухню',
  scaleQ:'?',
  // level 2
  kAnswer:'Відповідь:',
  kBad:'Поня хитає головою. Спробуй ще раз.',
  kSetup:(p)=>`склади пропорцію: ${prop(p)}`,
  kRule:(p,i)=>{const k=p.map(fmt);return (i===0||i===3)
    ? `x — <span class="e">крайній</span> член. Помнож середні і поділи на відомий крайній: (${k[1]} ${MUL} ${k[2]}) ${DIV} ${i===0?k[3]:k[0]}.`
    : `x — <span class="m">середній</span> член. Помнож крайні і поділи на відомий середній: (${k[0]} ${MUL} ${k[3]}) ${DIV} ${i===1?k[2]:k[1]}.`},
  kGood:(p,a)=>`Так! Перевірка: добутки рівні, отже x = ${fmt(a)}.`,
  kDoneH:'Частування готове!', kDoneP:'Салат нарізано, фарби змішано, шарфик зв’язано. Друга зірка твоя.', toC:'До розслідування',
  // level 3
  cTap:'Натисни одну картку, потім іншу, і вони обміняються місцями.',
  cBack:'Повернути як було',
  cNotProp:(L,R)=>`Добутки не рівні (${fmt(L)} і ${fmt(R)}), це вже не пропорція.`,
  cOtherProp:'Це теж пропорція, але в завданні просили інакше переставити. Прочитай ще раз.',
  cSame:'Картки ще лежать як було. Поміняй їх місцями.',
  cGood:'Доказ знайдено!',
  cNumQ:'Яке число було на зжованій картці?',
  cDoneH:'Справу закрито!',
  cDoneP:'Це сусідський кіт Мурко! Моркву він не чіпав, він просто любить ганяти картки лапою. Свинки пробачили йому і навчили складати похідні пропорції. Третя зірка твоя!',
  toR:'Подивитися мій звіт',

const LESSON={
uk:`
  <div class="lead"><h2>Урок: що таке пропорція</h2><p style="margin-top:8px">Шість коротких кроків. Прочитай по черзі, а потім вирушай на рівні.</p></div>
  <div class="lessons">
    <div class="card lesson"><span class="num">Крок 1</span><h3>Відношення</h3>

    <div class="card lesson"><span class="num">Крок 2</span><h3>Пропорція — рівність двох відношень</h3>

      <p>Обидва відношення дорівнюють 0,5, тож їх можна з’єднати знаком «=»:</p>
      <div class="big"><span class="mark">1 : 2</span> = <span class="mark">${fr(4,7)} : ${fr(8,7)}</span></div></div>
    <div class="card lesson wide"><span class="num">Крок 3</span><h3>Крайні й середні члени</h3>
      <div class="big">${prop(['a','b','c','d'])}</div>
      <div class="legend"><span class="e">● крайні: a і d, стоять по краях</span><span class="m">● середні: b і c, стоять посередині</span></div>
      <p class="hand">Буля каже: крайні — як ми з Понею на краях дивана, а середні вмостилися посередині між нами!</p></div>
    <div class="card lesson key wide"><span class="num">Крок 4 · головне правило</span><h3>Основна властивість пропорції</h3>
      <div class="big">якщо a : b = c : d, то a · d = b · c</div>
      <p><b>Добуток крайніх дорівнює добутку середніх.</b> Так можна перевірити, чи це справді пропорція.</p>

      <ol class="swaps">
        <li>переставили крайні: ${prop([24,40,6,10])}</li>
        <li>переставили середні: ${prop([10,6,40,24])}</li>

  </div>

en:`
  <div class="lead"><h2>Lesson: what is a proportion?</h2><p style="margin-top:8px">Six short steps. Read them in order, then head off to the levels.</p></div>
  <div class="lessons">
    <div class="card lesson"><span class="num">Step 1</span><h3>Ratio</h3>
      <p>A <b>ratio</b> compares two numbers by dividing one by the other. We read it as "one to two".</p>
      <div class="big">1 : 2 = 0.5</div>
      <p>It tells you how many times bigger one number is, or what fraction of the other it is. Here 1 is half of 2.</p></div>
    <div class="card lesson"><span class="num">Step 2</span><h3>A proportion is two equal ratios</h3>
      <div class="big">${fr(4,7)} : ${fr(8,7)} = ${fr(4,7)} × ${fr(7,8)} = 0.5</div>
      <p>Both ratios equal 0.5, so we can join them with an equals sign:</p>
      <div class="big"><span class="mark">1 : 2</span> = <span class="mark">${fr(4,7)} : ${fr(8,7)}</span></div></div>
    <div class="card lesson wide"><span class="num">Step 3</span><h3>Outer and inner numbers</h3>
      <div class="big">${prop(['a','b','c','d'])}</div>
      <div class="legend"><span class="e">● outer numbers (extremes): a and d, at the ends</span><span class="m">● inner numbers (means): b and c, in the middle</span></div>
      <p class="hand">Bulya says: the outer ones are like me and Ponya at each end of the sofa, and the inner ones squeeze in between us!</p></div>
    <div class="card lesson key wide"><span class="num">Step 4 · the big rule</span><h3>The key property of a proportion</h3>
      <div class="big">if a : b = c : d, then a × d = b × c</div>
      <p><b>The outer numbers multiplied equal the inner numbers multiplied.</b> This is called cross-multiplying, and it tells you whether something really is a proportion.</p>
      <div class="ex">10 : 40 = 6 : 24 → 10 × 24 = 240 and 40 × 6 = 240 ✔</div></div>
    <div class="card lesson"><span class="num">Step 5</span><h3>A missing outer number</h3>
      <p><b>= inner numbers multiplied ÷ the other outer number</b></p>
      <div class="big">${prop([5,8,15,'y'])}</div>
      <div class="ex">y = (8 × 15) ÷ 5 = 120 ÷ 5 = 24</div></div>
    <div class="card lesson"><span class="num">Step 5</span><h3>A missing inner number</h3>
      <p><b>= outer numbers multiplied ÷ the other inner number</b></p>
      <div class="big">${prop([12,'x',4,5])}</div>
      <div class="ex">x = (12 × 5) ÷ 4 = 60 ÷ 4 = 15</div></div>
    <div class="card lesson wide"><span class="num">Step 6</span><h3>Swapping to make new proportions</h3>
      <p>From one proportion you can make three more. The products stay the same, so the equation still holds. From ${prop([10,40,6,24])}:</p>
      <ol class="swaps">
        <li>swap the outer numbers: ${prop([24,40,6,10])}</li>
        <li>swap the inner numbers: ${prop([10,6,40,24])}</li>
        <li>swap both pairs: ${prop([24,6,40,10])}</li>
      </ol></div>
  </div>
  <div class="note"><div class="notePig"></div><p class="hand">Ponya says: once you've found the missing number, put it back in and check the products. Then you'll never go wrong!</p></div>
  <div><button class="btn" data-go="p">Go to level 1</button></div>`}[LANG];
$('#p-learn').innerHTML=LESSON;

/* ---------- state ---------- */
const fresh=()=>({tab:'learn',p:0,pDone:false,k:0,kDone:false,c:0,cDone:false,log:{},firstAt:null,lastAt:null});
let state=fresh();
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)state=Object.assign(state,s)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function rec(key,ok,hint){const e=state.log[key]||(state.log[key]={t:0,h:false,ok:false});if(e.ok)return;e.t++;if(hint)e.h=true;if(ok)e.ok=true;if(!state.firstAt)state.firstAt=Date.now();state.lastAt=Date.now();save()}
function clearLog(p){Object.keys(state.log).forEach(k=>{if(k[0]===p)delete state.log[k]})}

const tabs=['learn','p','k','c','report'];
function show(t){
  state.tab=t;save();if(t==='report')renderReport();
  tabs.forEach(x=>{$('#p-'+x).hidden=x!==t;$('#t-'+x).setAttribute('aria-selected',x===t)});
}
const go=t=>{show(t);window.scrollTo({top:0})};

function stars(){

const dots=(n,i)=>`<div class="dots">${Array.from({length:n},(_,j)=>`<span class="dot ${j<i?'on':''} ${j===i?'cur':''}"></span>`).join('')}</div>`;
const eq=(a,b)=>a!==null&&Math.abs(a-b)<1e-9;

/* ---------- level 1: scales ---------- */
const pTasks=[
  {p:[2,5,6,15],prod:true},
  {p:[3,4,6,9],prod:true},
  {p:[12,16,3,4],prod:true},
  {p:[10,40,6,24]},
  {p:[7,3,21,10]},
  {p:[0.5,2,3,12]}
];
let pStage=0, pShown=false;
function scaleSVG(L,R,known){
  const th=known?(eq(L,R)?0:(L>R?-9:9)):0, rad=th*Math.PI/180, cx=150, cy=40, len=104;
  const lx=cx-len*Math.cos(rad), ly=cy-len*Math.sin(rad), rx=cx+len*Math.cos(rad), ry=cy+len*Math.sin(rad);
  const pan=(x,y,val,col,lab)=>`<g>
    <line x1="${x}" y1="${y}" x2="${x-32}" y2="${y+56}" stroke="var(--muted)" stroke-width="2"/>
    <line x1="${x}" y1="${y}" x2="${x+32}" y2="${y+56}" stroke="var(--muted)" stroke-width="2"/>
    <path d="M${x-42} ${y+56} Q${x} ${y+80} ${x+42} ${y+56} Z" fill="var(--cell)" stroke="${col}" stroke-width="3"/>
    <text x="${x}" y="${y+50}" text-anchor="middle" font-family="Comfortaa,Nunito,sans-serif" font-weight="700" font-size="22" fill="${col}">${known?fmt(val):S.scaleQ}</text>
    <text x="${x}" y="${y+96}" text-anchor="middle" font-family="Nunito,sans-serif" font-weight="800" font-size="13" fill="${col}">${lab}</text></g>`;
  return `<svg viewBox="0 0 300 210" class="scale" role="img" aria-label="${known?fmt(L)+' / '+fmt(R):'?'}">
    <rect x="105" y="190" width="90" height="12" rx="6" fill="var(--hay)"/>
    <rect x="145" y="40" width="10" height="152" rx="4" fill="var(--hay)"/>
    <line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="var(--ink)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="8" fill="var(--leaf)"/>
    ${pan(lx,ly,L,'var(--yarn)',S.outer)}${pan(rx,ry,R,'var(--plum)',S.inner)}
  </svg>`;
}
function drawScale(known){
  const t=pTasks[Math.min(state.p,pTasks.length-1)], p=t.p;
  const done=state.pDone;
  const P=done?[10,40,6,24]:p;
  $('#scaleProp').innerHTML=prop(P);
  $('#scale').innerHTML=scaleSVG(P[0]*P[3],P[1]*P[2],known||done);
}
function renderP(){
  const box=$('#pTask');
  if(state.pDone||state.p>=pTasks.length){
    state.pDone=true;save();stars();drawScale(true);
    box.innerHTML=`<div class="step">${S.done}</div><h3>${S.pDoneH}</h3><p>${S.pDoneP}</p><div class="row"><button class="btn" data-go="k">${S.toK}</button></div>`;
    return;
  }
  const t=pTasks[state.p], key='p'+state.p;
  let html=`<div class="step">${S.task(state.p+1,pTasks.length)}</div>${dots(pTasks.length,state.p)}`;
  if(t.prod&&pStage===0){
    html+=`<p>${S.pProdQ}</p>
      <div class="row"><label class="lab e" for="pe">${S.pProdE}</label><input class="ans ie" id="pe" inputmode="decimal" placeholder="?"></div>
      <div class="row"><label class="lab m" for="pm">${S.pProdM}</label><input class="ans im" id="pm" inputmode="decimal" placeholder="?"></div>
      <div class="row"><button class="btn" id="pCheck">${S.check}</button></div>`;
  }else{
    html+=`<p>${t.prod?S.pYesNoQ:S.pYesNoQ2}</p>
      <div class="row"><button class="btn opt" data-yn="1">${S.yes}</button><button class="btn opt" data-yn="0">${S.no}</button></div>`;
  }
  html+=`<div class="fb" id="pFb" aria-live="polite"></div><div class="hint" id="pHint" hidden></div>`;
  box.innerHTML=html;
  const fb=$('#pFb'), L=t.p[0]*t.p[3], R=t.p[1]*t.p[2];
  const hint=h=>{const el=$('#pHint');el.hidden=false;el.innerHTML=S.hint+h};
  if(t.prod&&pStage===0){
    const check=()=>{
      const a=num($('#pe').value), b=num($('#pm').value);
      fb.className='fb pop';
      if(a===null||b===null){fb.classList.add('bad');fb.textContent=S.typeNum;return}
      if(eq(a,L)&&eq(b,R)){pStage=1;pShown=true;drawScale(true);renderP();return}
      rec(key,false,true);fb.classList.add('bad');fb.textContent=S.pProdBad;hint(S.pProdHint(t.p));
    };
    $('#pCheck').onclick=check;
    box.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')check()});
  }else{
    box.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{
      const said=b.dataset.yn==='1', truth=eq(L,R);
      fb.className='fb pop';
      if(said===truth){
        rec(key,true,false);drawScale(true);fb.classList.add('good');fb.textContent=truth?S.pOkYes(L,R):S.pOkNo(L,R);
        box.querySelectorAll('[data-yn]').forEach(x=>x.disabled=true);
        setTimeout(()=>{state.p++;pStage=0;pShown=false;save();drawScale(false);renderP()},1700);
      }else{rec(key,false,true);fb.classList.add('bad');fb.textContent=S.pBadYN;hint(S.pYNHint(t.p))}
    });
  }
}
function startP(){pStage=0;pShown=false;drawScale(false);renderP()}
$('#pReset').onclick=()=>{state.p=0;state.pDone=false;clearLog('p');save();stars();startP()};

/* ---------- level 2: kitchen ---------- */
const kTasks=[
  {p:[12,'x',4,5],ans:15,show:true,text:{uk:'Перше — приклад з уроку. Знайди x.',en:'The first one is an example from the lesson. Find x.'}},
  {p:[5,8,15,'x'],ans:24,show:true,text:{uk:'І ще один приклад з уроку. Знайди x.',en:'One more example from the lesson. Find x.'}},
  {p:[2,6,5,'x'],ans:15,unit:{uk:'скибочок',en:'slices'},text:{uk:'Для двох свинок Поня кладе в салат 6 скибочок огірка. До них прийшли гості, і тепер свинок п’ять. Скільки скибочок огірка треба?',en:'For two guinea pigs, Ponya puts 6 slices of cucumber in the salad. Some friends have come round and now there are five guinea pigs. How many slices of cucumber are needed?'}},
  {p:[3,24,'x',40],ans:5,unit:{uk:'морквин',en:'carrots'},text:{uk:'З 3 морквин виходить 24 кружечки. Скільки морквин треба нарізати, щоб вийшло 40 кружечків?',en:'3 carrots make 24 carrot rounds. How many carrots do you need to chop to make 40 rounds?'}},
  {p:[3,5,12,'x'],ans:20,unit:{uk:'крапель',en:'drops'},text:{uk:'Для бузкового фону до портрета свинок змішують 3 краплі червоної фарби і 5 крапель синьої. Скільки крапель синьої треба на 12 крапель червоної?',en:'To paint a lilac background for the guinea pigs\' portrait, you mix 3 drops of red paint with 5 drops of blue. How many drops of blue do you need for 12 drops of red?'}},
  {p:[4,10,'x',25],ans:10,unit:{uk:'рядів',en:'rows'},text:{uk:'Шарфик для Булі: 4 ряди — це 10 см. Скільки рядів треба зв’язати, щоб шарфик був 25 см завдовжки?',en:'Bulya\'s scarf: 4 rows make 10 cm. How many rows do you need to knit for a scarf 25 cm long?'}}
];
let kTries=0;
function renderK(){
  const box=$('#kTask');
  if(state.kDone||state.k>=kTasks.length){
    state.kDone=true;save();stars();
    box.innerHTML=`<div class="note">${pig(PONYA)}<div class="task"><div class="step">${S.done}</div><h3>${S.kDoneH}</h3><p>${S.kDoneP}</p><div class="row"><button class="btn" data-go="c">${S.toC}</button></div></div></div>`;
    return;
  }
  const t=kTasks[state.k], key='k'+state.k, xi=t.p.indexOf('x');
  box.innerHTML=`<div class="step">${S.task(state.k+1,kTasks.length)}</div>${dots(kTasks.length,state.k)}
    <div class="recipe"><p>${tr(t.text)}</p>${t.show?`<div class="big">${prop(t.p)}</div>`:''}</div>
    <div class="row"><label class="lab" for="kAns">${t.show?'x =':S.kAnswer}</label><input class="ans" id="kAns" inputmode="decimal" placeholder="?">${t.unit?`<b>${tr(t.unit)}</b>`:''}<button class="btn" id="kCheck">${S.check}</button></div>
    <div class="fb" id="kFb" aria-live="polite"></div><div class="hint" id="kHint" hidden></div>`;
  const check=()=>{
    const v=num($('#kAns').value), fb=$('#kFb');
    fb.className='fb pop';
    if(v===null){fb.classList.add('bad');fb.textContent=S.typeNum;return}
    if(eq(v,t.ans)){
      rec(key,true,false);fb.classList.add('good');fb.textContent=S.kGood(t.p,t.ans);$('#kCheck').disabled=true;
      setTimeout(()=>{state.k++;kTries=0;save();renderK()},1300);return;
    }
    kTries++;rec(key,false,true);fb.classList.add('bad');fb.textContent=S.kBad;
    const h=$('#kHint');h.hidden=false;
    h.innerHTML=S.hint+((t.show||kTries>=2)?S.kRule(t.p,xi):S.kSetup(t.p));
  };
  $('#kCheck').onclick=check;$('#kAns').onkeydown=e=>{if(e.key==='Enter')check()};
}
$('#kReset').onclick=()=>{state.k=0;state.kDone=false;kTries=0;clearLog('k');save();stars();renderK()};

/* ---------- level 3: cards ---------- */
const NAME=UK?['М','У','Р','К','О']:['M','U','R','K','O'];
const ORIG=[10,40,6,24];
const cTasks=[
  {type:'swap',target:[24,40,6,10],text:{uk:'Спершу перевіримо, що вміє Поня. Поміняй місцями <span class="e">крайні</span> члени.',en:'First, let\'s see what Ponya can do. Swap the <span class="e">outer</span> numbers.'}},
  {type:'swap',target:[10,6,40,24],text:{uk:'Картки знову лежать як увечері. Тепер поміняй місцями <span class="m">середні</span> члени.',en:'The cards are back the way they were. Now swap the <span class="m">inner</span> numbers.'}},
  {type:'swap',target:[24,6,40,10],text:{uk:'І знову з початку. Поміняй місцями і <span class="e">крайні</span>, і <span class="m">середні</span>.',en:'Back to the start again. Swap <span class="e">both</span> the outer <span class="m">and</span> the inner numbers.'}},
  {type:'yn',show:[40,10,6,24],truth:false,text:{uk:'А ось як картки лежали вранці. Невідомий гравець поміняв 10 і 40. Це ще пропорція?',en:'This is how the cards were lying in the morning. The mystery player swapped 10 and 40. Is it still a proportion?'},
   why:{uk:'Ні: 40 · 24 = 960, а 10 · 6 = 60. Міняти можна лише крайні між собою або середні між собою.',en:'No: 40 × 24 = 960, but 10 × 6 = 60. You can only swap the outer numbers with each other, or the inner numbers with each other.'}},
  {type:'num',show:[24,6,40,'x'],ans:10,text:{uk:'Остання картка погризена: на ній видно лише сліди зубів і пазурів. Поня пам’ятає, що це була похідна пропорція.',en:'The last card has been chewed: all you can see are tooth and claw marks. Ponya remembers it was one of the swapped proportions.'}}
];
let cards=[...ORIG], sel=null;
const posCol=i=>(i===0||i===3)?'var(--yarn)':'var(--plum)';
function drawCards(t,interactive){
  const arr=t&&t.show?t.show:cards;
  $('#cStage').innerHTML=`<div class="cards">${arr.map((v,i)=>{
    const card=v==='x'
      ?`<span class="pc" style="--c:${posCol(i)}"><input id="cAns" inputmode="decimal" placeholder="?" aria-label="?"></span>`
      :`<button class="pc ${sel===i?'sel':''}" style="--c:${posCol(i)}" data-i="${i}" ${interactive?'':'disabled'}>${fmt(v)}</button>`;
    return card+(i===0||i===2?'<span>:</span>':i===1?'<span>=</span>':'');
  }).join('')}</div>
  <div class="legend" style="justify-content:center;font-size:14px"><span class="e">● ${UK?'крайні місця':'outer places'}</span><span class="m">● ${UK?'середні місця':'inner places'}</span></div>
  ${interactive?`<p style="color:var(--muted);font-size:15px">${S.cTap}</p>`:''}`;
  if(interactive)$('#cStage').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(sel===null){sel=i}else if(sel===i){sel=null}else{[cards[sel],cards[i]]=[cards[i],cards[sel]];sel=null}
    drawCards(t,true);
  });
}
function renderC(){
  const opened=Math.min(state.c,NAME.length);
  $('#slots').innerHTML=NAME.map((l,i)=>`<div class="slot ${i<opened?'open':''}">${i<opened?l:'?'}</div>`).join('');
  const box=$('#cTask');
  if(state.cDone||state.c>=cTasks.length){
    state.cDone=true;save();stars();
    $('#cStage').innerHTML=`<div class="reveal">${pig(BULYA)}${cat()}${pig(PONYA)}</div><div class="big" style="justify-content:center">${UK?'Мурко':'Murko'}</div>`;
    box.innerHTML=`<div class="step">${S.done}</div><h3>${S.cDoneH}</h3><p>${S.cDoneP}</p><div class="row"><button class="btn" data-go="report">${S.toR}</button></div>`;
    return;
  }
  const t=cTasks[state.c], key='c'+state.c;
  sel=null;
  let html=`<div class="step">${S.rowClue} ${state.c+1} / ${cTasks.length}</div><p>${tr(t.text)}</p>`;
  if(t.type==='swap')html+=`<div class="row"><button class="btn" id="cCheck">${S.check}</button><button class="btn ghost" id="cBack">${S.cBack}</button></div>`;
  if(t.type==='yn')html+=`<div class="row"><button class="btn opt" data-yn="1">${S.yes}</button><button class="btn opt" data-yn="0">${S.no}</button></div>`;
  if(t.type==='num')html+=`<p><b>${S.cNumQ}</b></p><div class="row"><button class="btn" id="cCheck">${S.check}</button></div>`;
  html+=`<div class="fb" id="cFb" aria-live="polite"></div><div class="hint" id="cHint" hidden></div>`;
  box.innerHTML=html;
  drawCards(t,t.type==='swap');
  const fb=$('#cFb');
  const win=msg=>{rec(key,true,false);fb.className='fb pop good';fb.innerHTML=msg||S.cGood;box.querySelectorAll('button').forEach(b=>b.disabled=true);
    $('#cStage').querySelectorAll('button').forEach(b=>b.disabled=true);
    setTimeout(()=>{state.c++;cards=[...ORIG];save();renderC()},msg?2600:1200)};
  const lose=(msg,h)=>{rec(key,false,!!h);fb.className='fb pop bad';fb.innerHTML=msg;if(h){const el=$('#cHint');el.hidden=false;el.innerHTML=S.hint+h}};
  if(t.type==='swap'){
    $('#cBack').onclick=()=>{cards=[...ORIG];sel=null;drawCards(t,true)};
    $('#cCheck').onclick=()=>{
      const L=cards[0]*cards[3], R=cards[1]*cards[2];
      if(cards.every((v,i)=>v===t.target[i]))return win();
      if(cards.every((v,i)=>v===ORIG[i]))return lose(S.cSame);
      if(!eq(L,R))return lose(S.cNotProp(L,R),UK?'подивись крок 6 в уроці: там показано всі три перестановки.':'step 6 of the lesson shows all three swaps.');
      lose(S.cOtherProp,UK?'крайні — це рожеві місця (перше й останнє), середні — фіолетові (друге й третє).':'the outer places are pink (first and last), the inner places are violet (second and third).');
    };
  }
  if(t.type==='yn')box.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{
    if((b.dataset.yn==='1')===t.truth)win(tr(t.why));else lose(S.pBadYN,S.pYNHint(t.show));
  });
  if(t.type==='num'){
    const check=()=>{const v=num($('#cAns').value);if(v===null)return lose(S.typeNum);
      if(eq(v,t.ans))return win();
      lose(UK?'Не те число.':'That\'s not the right number.',S.kRule(t.show,3));};
    $('#cCheck').onclick=check;$('#cAns').onkeydown=e=>{if(e.key==='Enter')check()};
  }
}
$('#cReset').onclick=()=>{state.c=0;state.cDone=false;cards=[...ORIG];clearLog('c');save();stars();renderC()};

/* ---------- report ---------- */
const plain=p=>p.map(fmt).join(' ').replace(/^(\S+) (\S+) (\S+) (\S+)$/,'$1 : $2 = $3 : $4');
function fmtDate(ts){return ts?new Date(ts).toLocaleDateString(S.locale):S.notStarted}
function statusOf(key){
  const e=state.log[key];
  if(!e||!e.t)return {cls:'no',txt:S.notTried};
  const h=e.h?S.withHint:'';
  if(e.ok)return e.t===1?{cls:'ok',txt:S.first}:{cls:'mid',txt:S.nth(e.t)+h};
  return {cls:'bad',txt:S.notYet(e.t)+h};
}
function reportData(){
  return [
    {name:S.lvP,done:state.pDone,rows:pTasks.map((t,i)=>({key:'p'+i,label:`${S.rowTask} ${i+1}: ${plain(t.p)}`}))},
    {name:S.lvK,done:state.kDone,rows:kTasks.map((t,i)=>({key:'k'+i,label:`${S.rowTask} ${i+1}: ${plain(t.p)}`}))},
    {name:S.lvC,done:state.cDone,rows:cTasks.map((t,i)=>({key:'c'+i,label:`${S.rowClue} ${i+1}`}))}
  ];
}
function renderReport(){
  const data=reportData();let solved=0,total=0,first=0,hints=0;
  data.forEach(l=>l.rows.forEach(r=>{const e=state.log[r.key];total++;if(e&&e.ok){solved++;if(e.t===1)first++}if(e&&e.h)hints++}));
  const n=[state.pDone,state.kDone,state.cDone].filter(Boolean).length;
  $('#reportCard').innerHTML=`<div class="rep">
    <p><b>${S.repStars(n)}</b> ${S.repSum(solved,total,first,hints)}</p>
    ${data.map(l=>`<div><h3>${l.name}${l.done?` <span class="st ok">${S.complete}</span>`:''}</h3><ul>${l.rows.map(r=>{const s=statusOf(r.key);return `<li><span>${r.label}</span><span class="st ${s.cls}">${s.txt}</span></li>`}).join('')}</ul></div>`).join('')}
    <p class="hint">${S.repDates(fmtDate(state.firstAt),fmtDate(state.lastAt))}</p></div>`;
  const lines=[S.repHead,S.repStars(n),S.repSum(solved,total,first,hints),''];
  data.forEach(l=>{lines.push(`${l.name}${l.done?` (${S.complete})`:''}:`);l.rows.forEach(r=>lines.push(`• ${r.label}: ${statusOf(r.key).txt}`));lines.push('')});
  lines.push(S.repDates(fmtDate(state.firstAt),fmtDate(state.lastAt)));
  $('#reportText').value=lines.join('\n');
}
$('#copyReport').onclick=()=>{
  renderReport();const txt=$('#reportText').value, fb=$('#copyFb');
  const manual=()=>{const ta=$('#reportText');ta.hidden=false;ta.focus();ta.select();fb.className='fb bad';fb.textContent=S.copyFail};
  try{navigator.clipboard.writeText(txt).then(()=>{fb.className='fb good pop';fb.textContent=S.copied},manual)}catch(e){manual()}
};

let armed=false;
$('#resetAll').onclick=()=>{
  const b=$('#resetAll');
  if(!armed){armed=true;b.textContent=S.resetSure;setTimeout(()=>{armed=false;b.textContent=S.resetAll},4000);return}
  armed=false;b.textContent=S.resetAll;state=fresh();cards=[...ORIG];kTries=0;save();
  show('learn');startP();renderK();renderC();stars();window.scrollTo({top:0});
};
show(tabs.includes(state.tab)?state.tab:'learn');
startP();renderK();renderC();stars();
</script>

    });

</script>
<script>
(function(){
  /* own devices: open the site with #nostats once to stop counting this browser, #stats to count again */
  var SK='skipgc', skip=false;
  try{
    if(location.hash==='#nostats')localStorage.setItem(SK,'t');
    if(location.hash==='#stats')localStorage.removeItem(SK);
    skip=localStorage.getItem(SK)==='t';
  }catch(e){}
  var uk=document.documentElement.lang==='uk';
  if(location.hash==='#nostats'||location.hash==='#stats'){
    var n=document.createElement('div');
    n.textContent=skip?(uk?'Статистику на цьому пристрої вимкнено. Ваші відвідування не рахуються.':'Statistics are off on this device. Your visits are not counted.')
                      :(uk?'Статистику на цьому пристрої знову ввімкнено.':'Statistics are on again on this device.');
    n.style.cssText='position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;padding:12px 16px;border-radius:12px;background:#26301F;color:#fff;font:700 15px system-ui,sans-serif;text-align:center';
    document.body.appendChild(n);setTimeout(function(){n.remove()},6000);
  }
  if(skip){
    var f=document.querySelector('.site-copy');
    if(f){var m=document.createElement('small');m.textContent=uk?'(цей пристрій не враховується)':'(this device is not counted)';f.appendChild(m)}
    window.ponyaTrack=function(){};return;
  }
  var gs=document.createElement('script');gs.async=true;gs.src='//gc.zgo.at/count.js';
  gs.setAttribute('data-goatcounter','https://varia-math.goatcounter.com/count');document.head.appendChild(gs);

  var parts=location.pathname.replace(/\.html$/,'').split('/').filter(Boolean);
  var page=parts.slice(-2).join('-')||'index';            // e.g. monomials-uk, math-index
  var queue=[];
  function send(name){window.goatcounter.count({path:page+'/'+name,title:name,event:true})}
  function track(name){
    try{if(window.goatcounter&&window.goatcounter.count)send(name);else queue.push(name)}catch(e){}
  }
  gs.onload=function(){var q=queue;queue=[];q.forEach(function(n){try{send(n)}catch(e){}})};
  window.ponyaTrack=track;

  document.addEventListener('click',function(e){
    var t=e.target.closest('button,a');if(!t)return;
    if(t.classList.contains('tab')&&t.dataset.tab)track('tab-'+t.dataset.tab);
    else if(t.id==='copyReport')track('report-copy');
    else if(t.id==='shareReport')track('report-send');
    else if(t.dataset&&t.dataset.w)track('world-'+t.dataset.w);
    else if(t.tagName==='A'&&/\.pdf$/.test(t.getAttribute('href')||''))track('pdf-'+t.getAttribute('href').replace(/\W+/g,'-'));
  },true);

  /* every task: solved on the first try, solved after mistakes, and the wrong answers typed (numbers only) */
  if(typeof window.rec==='function'&&typeof state==='object'&&state&&state.log){
    var orig=window.rec, wrong={}, sentVals={};
    function typed(){
      var panel=document.querySelector('.panel:not([hidden])');if(!panel)return '';
      var vals=[];
      panel.querySelectorAll('input').forEach(function(i){
        if(!i.offsetParent||vals.length>=6)return;
        var v=String(i.value).trim().replace(/[−–]/g,'-').replace(',','.');
        vals.push(v===''?'_':(/^-?\d{1,6}(\.\d{1,4})?$/.test(v)?v:'x'));
      });
      return vals.join(';');
    }
    window.rec=function(key,ok,hint){
      var done=state.log[key]&&state.log[key].ok;
      if(!done){
        if(ok)track('task-'+key+(wrong[key]?'-after-mistakes':'-first-try'));
        else{
          if(!wrong[key])track('task-'+key+'-mistake');
          wrong[key]=(wrong[key]||0)+1;
          var v=typed();
          if(v&&!sentVals[key+v]){sentVals[key+v]=1;track('typed-'+key+'/'+v)}
        }
      }
      return orig.apply(this,arguments);
    };
  }

  /* a level is finished when its star lights up; the diploma appears after all three */
  document.querySelectorAll('.star').forEach(function(st){
    new MutationObserver(function(){if(st.classList.contains('on')&&!st.dataset.seen){st.dataset.seen=1;track('level-done-'+st.id.replace('st-',''))}})
      .observe(st,{attributes:true,attributeFilter:['class']});
  });
  var dip=document.getElementById('diploma');
  if(dip)new MutationObserver(function(){if(!dip.hidden)track('diploma')}).observe(dip,{attributes:true,attributeFilter:['hidden']});
})();
</script>
